name: build-tunnelku

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: "Install SDK packages (compileSdk 35)"
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'app/build.gradle') }}

      # TunnelKu: keystore tetap (JKS) dari secret sejak rilis pertama.
      - name: Pulihkan keystore tetap dari secret
        env:
          TUNNELKU_KEYSTORE_BASE64: ${{ secrets.TUNNELKU_KEYSTORE_BASE64 }}
          TUNNELKU_KEYSTORE_PASSWORD: ${{ secrets.TUNNELKU_KEYSTORE_PASSWORD }}
          TUNNELKU_KEY_ALIAS: ${{ secrets.TUNNELKU_KEY_ALIAS }}
          TUNNELKU_KEY_PASSWORD: ${{ secrets.TUNNELKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TUNNELKU_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret TUNNELKU_KEYSTORE_BASE64 belum diisi — build dibatalkan agar tidak bertanda tangan acak."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$TUNNELKU_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/tunnelku.keystore"
          test -s "$HOME/.android/tunnelku.keystore"
          {
            echo "TUNNELKU_STORE_FILE=$HOME/.android/tunnelku.keystore"
            echo "TUNNELKU_STORE_PASSWORD=$TUNNELKU_KEYSTORE_PASSWORD"
            echo "TUNNELKU_KEY_ALIAS=$TUNNELKU_KEY_ALIAS"
            echo "TUNNELKU_KEY_PASSWORD=$TUNNELKU_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Keystore tetap dipulihkan ($(stat -c%s "$HOME/.android/tunnelku.keystore") byte)."

      - name: Setup Go 1.20 (mesin DNSTT + Hysteria)
        uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'

      - name: Ambil sumber resmi dnstt & hysteria + bangun engine.aar (gomobile)
        run: |
          set -euo pipefail
          cd engine
          git clone --quiet https://www.bamsoftware.com/git/dnstt.git dnstt-src
          rm -rf dnstt-src/.git
          sed -i 's/^go 1.21$/go 1.20/' dnstt-src/go.mod
          sed -i 's#github.com/xtaci/kcp-go/v5 v5.6.8#github.com/xtaci/kcp-go/v5 v5.6.1#; s#github.com/xtaci/smux v1.5.24#github.com/xtaci/smux v1.5.19#' dnstt-src/go.mod
          git clone --quiet --depth 1 --branch v1.3.5 https://github.com/apernet/hysteria.git hysteria-src
          rm -rf hysteria-src/.git
          export GOPATH="$HOME/go"
          mkdir -p "$GOPATH/bin"
          git clone --quiet https://github.com/golang/mobile.git "$HOME/mobile-src"
          git -C "$HOME/mobile-src" checkout --quiet 3c911d8e3edae4ddeea7f8a6e3ea9eae74f1a81a
          (cd "$HOME/mobile-src" && go build -o "$GOPATH/bin/gomobile" ./cmd/gomobile && go build -o "$GOPATH/bin/gobind" ./cmd/gobind)
          export PATH="$GOPATH/bin:$PATH"
          export ANDROID_NDK_HOME=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          echo "NDK: $ANDROID_NDK_HOME"
          GOFLAGS=-mod=mod go mod tidy
          gomobile init
          mkdir -p ../app/libs
          gomobile bind -target=android/arm64,android/arm -androidapi 26 -o ../app/libs/engine.aar .
          ls -lh ../app/libs/engine.aar

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verifikasi APK (paket, versi, sidik jari penanda tangan)
        env:
          EXPECTED_SHA256: "3978BE01798CA1A7598115BBA6089BA13DA16E2D9FCF9C8940DDEB1F5BC6440F"
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          test -n "$APK"
          echo "APK: $APK"
          ls -lh "$APK"
          sha256sum "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -3
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump permissions "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          echo "--- apksigner verify ---"
          "$APKSIGNER" verify --print-certs "$APK"
          FP=$("$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256 digest" | head -1 | awk '{print $NF}' | tr -d ':' | tr 'a-f' 'A-F')
          echo "Fingerprint SHA-256: $FP"
          test -n "$FP"
          if [ "$FP" != "$EXPECTED_SHA256" ]; then
            echo "::error::Fingerprint ($FP) tidak cocok dengan keystore yang di-pin ($EXPECTED_SHA256)."
            exit 1
          fi
          echo "Fingerprint COCOK dengan keystore yang di-pin."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tunnelku-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
